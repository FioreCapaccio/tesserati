name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'   # per i test non serve scaricare Electron
      - run: npm test

  build:
    name: Build ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Mac (Apple Silicon)
            os: macos-latest
            script: npx electron-builder --mac --arm64 --publish never
            artifact: tesserati-mac-arm64
            files: |
              dist/*.dmg
              dist/*-mac.zip
          - name: Windows (x64)
            os: windows-latest
            script: npx electron-builder --win --x64 --publish never
            artifact: tesserati-windows-x64
            files: |
              dist/*.exe
              dist/*-win.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: La versione del tag deve coincidere con package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          pkg="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::Il tag è v$tag ma package.json è alla versione $pkg"
            exit 1
          fi

      - name: Build
        run: ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # nessuna firma del codice (nessun certificato configurato)

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Pubblica release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
